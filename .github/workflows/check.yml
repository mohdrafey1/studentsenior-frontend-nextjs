name: Check
on:
  pull_request:
  push:
    branches: [main, master, production]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:59999/api/v2
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3010
      NEXT_PUBLIC_FIREBASE_API_KEY: local-fixture
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: fixture.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: fixture-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: fixture.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      NEXT_PUBLIC_FIREBASE_APP_ID: fixture-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --audit-level=high
